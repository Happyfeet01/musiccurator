name: Build and sign MusicCurator release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: &release_paths
      - 'appinfo/info.xml'
      - 'package.json'
      - 'docs/releases/**'
      - '.github/workflows/release.yml'
      - '.github/scripts/musiccurator-occ.sh'
  pull_request:
    branches: [main]
    paths: *release_paths

permissions:
  contents: read

concurrency:
  group: musiccurator-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: simplexml,xmlreader,mbstring
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read release metadata from this commit
        id: metadata
        run: |
          set -euo pipefail
          version=$(php -r 'echo simplexml_load_file("appinfo/info.xml")->version;')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$version" = "$(node -p 'require("./package.json").version')"
          test -s CHANGELOG.md
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and check release files
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          find appinfo lib templates -name '*.php' -type f -print0 | xargs -0 -n1 php -l >/dev/null
          npm ci
          npm run l10n:check
          npm run lint
          npm run stylelint
          npm run test:frontend
          npm run build
          node scripts/audit-dependencies.mjs
          test -s js/musiccurator-main.mjs
          test -s css/musiccurator-main.css
          stage="$RUNNER_TEMP/stage/musiccurator"
          mkdir -p "$stage" "$RUNNER_TEMP/unsigned"
          for directory in appinfo lib templates img js css l10n; do
            cp -R "$directory" "$stage/"
          done
          cp LICENSE README.md CHANGELOG.md "$stage/"
          rm -f "$stage/appinfo/signature.json"
          tar -czf "$RUNNER_TEMP/unsigned/package.tar.gz" -C "$RUNNER_TEMP/stage" musiccurator
          printf "MusicCurator %s — rebuilt and signed release.\n" "$VERSION" > "$RUNNER_TEMP/unsigned/release.md"

      - name: Check isolated Nextcloud signing tools
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/musiccurator-occ.sh "$RUNNER_TEMP/stage" check-tools

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-musiccurator-${{ github.run_id }}
          path: ${{ runner.temp }}/unsigned/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  release:
    needs: build
    if: github.repository == 'Happyfeet01/musiccurator' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check published release and tag
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" --json isDraft,assets > "$RUNNER_TEMP/existing.json"; then
            if jq -e '.isDraft == false' "$RUNNER_TEMP/existing.json" >/dev/null; then
              for suffix in tar.gz signature tar.gz.sha256; do
                jq -e --arg name "musiccurator-$VERSION.$suffix" 'any(.assets[]; .name == $name)' "$RUNNER_TEMP/existing.json" >/dev/null
              done
              echo 'published=true' >> "$GITHUB_OUTPUT"
            fi
          fi
          if git ls-remote --exit-code "https://github.com/$GH_REPO.git" "refs/tags/$tag" >/dev/null; then
            tagged=$(gh api "repos/$GH_REPO/commits/$tag" --jq .sha)
            test "$tagged" = "$GITHUB_SHA" || { echo "::error::Tag $tag belongs to another commit"; exit 1; }
          fi

      - uses: actions/download-artifact@v4
        if: steps.existing.outputs.published != 'true'
        with:
          name: unsigned-musiccurator-${{ github.run_id }}
          path: ${{ runner.temp }}/unsigned

      - name: Sign and verify application and final archive
        if: steps.existing.outputs.published != 'true'
        env:
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_PUBLIC_CRT: ${{ secrets.APP_PUBLIC_CRT }}
        run: |
          set -euo pipefail
          umask 077
          : "${APP_PRIVATE_KEY:?Set the APP_PRIVATE_KEY Actions secret}"
          : "${APP_PUBLIC_CRT:?Set the APP_PUBLIC_CRT Actions secret}"
          keys=$(mktemp -d)
          trap 'rm -rf -- "$keys"' EXIT
          printf '%s\n' "$APP_PRIVATE_KEY" > "$keys/musiccurator.key"
          printf '%s\n' "$APP_PUBLIC_CRT" > "$keys/musiccurator.crt"
          unset APP_PRIVATE_KEY APP_PUBLIC_CRT
          umask 022
          stage="$RUNNER_TEMP/stage"
          out="$RUNNER_TEMP/signed"
          mkdir -p "$stage" "$out"
          tar -xzf "$RUNNER_TEMP/unsigned/package.tar.gz" -C "$stage"
          bash .github/scripts/musiccurator-occ.sh "$stage" sign "$keys"
          cd "$out"
          archive="musiccurator-$VERSION.tar.gz"
          tar -czf "$archive" -C "$stage" musiccurator
          openssl dgst -sha512 -sign "$keys/musiccurator.key" -out "$RUNNER_TEMP/archive.sig" "$archive"
          openssl base64 -A -in "$RUNNER_TEMP/archive.sig" -out "musiccurator-$VERSION.signature"
          openssl base64 -d -A -in "musiccurator-$VERSION.signature" -out "$RUNNER_TEMP/verify.sig"
          openssl x509 -in "$keys/musiccurator.crt" -pubkey -noout > "$RUNNER_TEMP/pubkey.pem"
          openssl dgst -sha512 -verify "$RUNNER_TEMP/pubkey.pem" -signature "$RUNNER_TEMP/verify.sig" "$archive"
          sha256sum "$archive" > "$archive.sha256"

      - name: Publish verified files together
        if: steps.existing.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "MusicCurator $VERSION" \
              --notes-file "$RUNNER_TEMP/unsigned/release.md"
          fi
          gh release view "$tag" --json isDraft,targetCommitish | jq -e --arg sha "$GITHUB_SHA" \
            '.isDraft and .targetCommitish == $sha' >/dev/null
          cd "$RUNNER_TEMP/signed"
          gh release upload "$tag" "musiccurator-$VERSION.tar.gz" "musiccurator-$VERSION.signature" \
            "musiccurator-$VERSION.tar.gz.sha256" --clobber
          gh release edit "$tag" --draft=false --latest

      - name: Publish signed archive to Nextcloud App Store
        env:
          GH_TOKEN: ${{ github.token }}
          APPSTORE_TOKEN: ${{ secrets.APPSTORE_TOKEN }}
        run: |
          set -euo pipefail
          : "${APPSTORE_TOKEN:?Missing APPSTORE_TOKEN}"
          mkdir -p "$RUNNER_TEMP/store"
          cd "$RUNNER_TEMP/store"
          gh release download "v$VERSION" --pattern "musiccurator-$VERSION.signature" --pattern "musiccurator-$VERSION.tar.gz" --pattern "musiccurator-$VERSION.tar.gz.sha256"
          sha256sum -c "musiccurator-$VERSION.tar.gz.sha256"
          url="https://github.com/$GH_REPO/releases/download/v$VERSION/musiccurator-$VERSION.tar.gz"
          jq -n --arg download "$url" --arg signature "$(cat "musiccurator-$VERSION.signature")" '{download:$download,signature:$signature,nightly:false}' > payload.json
          curl --fail-with-body --silent --show-error --header "Authorization: Token $APPSTORE_TOKEN" --header "Content-Type: application/json" --data-binary @payload.json https://apps.nextcloud.com/api/v1/apps/releases
