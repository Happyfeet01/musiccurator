<!doctype html><html><head><meta charset="utf-8"><title>MusicCurator — demo library</title><link rel="stylesheet" href="/css/musiccurator-main.css"><style>
:root{--default-grid-baseline:4px;--default-line-height:1.5;--font-weight-default:400;--font-weight-element:600;--font-weight-heading:700;--animation-quick:100ms;--animation-slow:300ms;--font-size-small:13px;--clickable-area-small:24px;--clickable-area-large:48px;--color-box-shadow:#172b3a15;--body-container-radius:16px;--color-main-background:#fff;--color-main-background-translucent:#ffffffdd;--color-background-dark:#f2f5f8;--color-background-hover:#e8eff5;--color-background-darker:#e5eaf0;--color-main-text:#172b3a;--color-text-maxcontrast:#607383;--color-primary:#00679e;--color-primary-element:#00679e;--color-primary-element-hover:#005887;--color-primary-element-light:#dceff9;--color-primary-element-text:#fff;--color-primary-element-light-text:#005580;--color-border:#dfe7ed;--color-border-dark:#c9d3dc;--color-border-maxcontrast:#9caebb;--color-success:#167b54;--color-error:#b93344;--border-radius:8px;--border-radius-large:12px;--border-radius-element:22px;--default-clickable-area:44px;--default-font-size:15px;--font-face:Arial,sans-serif;--body-container-margin:12px;--header-height:50px;--body-height:calc(100vh - 74px);--body-width:calc(100% - 24px);--navigation-width:250px;--app-navigation-width:250px}

</style></head><body><header id="header"><strong>☁ Nextcloud</strong><span>MusicCurator</span><small>Demo library · sample data</small></header><div id="musiccurator"></div><script>
window.OC={generateUrl:p=>p,requestToken:'demo',filePath:(app,type,path)=>'/'+path,getCurrentUser:()=>({uid:'demo',displayName:'Demo'}),isUserAdmin:()=>false,config:{modRewriteWorking:true}};window.OCP={};
const entries=[['Northern Lights','Aurora Lane','Afterglow','2025','Electronic'],['Coastline','Aurora Lane','Afterglow','2025','Electronic'],['Open Water','The Paper Satellites','Blue Hours','2024','Indie'],['Sunday Morning','The Paper Satellites','Blue Hours','2024','Indie'],['Golden Hour','Mila Rivers','Daylight','2026','Soul'],['Home Again','Mila Rivers','Daylight','2026','Soul'],['Night Train','Cedar Quartet','City Sessions','2023','Jazz'],['Quiet Streets','Cedar Quartet','City Sessions','2023','Jazz'],['','','Unknown album','','']];
const tracks=entries.map((e,i)=>({path:'/Music/'+(e[1]||'Inbox')+'/'+(e[2]||'Unsorted')+'/'+(e[0]||'track-09')+'.flac',filename:(e[0]||'track-09')+'.flac',extension:'flac',mime:'audio/flac',size:28000000,mtime:1793102400,title:e[0],artist:e[1],album:e[2],albumArtist:e[1],track:String(i+1),year:e[3],genre:e[4],tagged:!!e[0],status:e[0]?'tagged':'needs-tags'}));
window.fetch=async(input,init)=>{const url=new URL(typeof input==='string'?input:input.url,location.origin);let data={};if(url.pathname.endsWith('/settings'))data={libraryPath:'/Music',libraryConfigured:true,musicBrainzEnabled:true,discogsConfigured:true,lastFmConfigured:true,acoustIdConfigured:false};else if(url.pathname.endsWith('/library/cache'))data={tracks,playlists:[{path:'/Music/Playlists/Favourites.m3u8',name:'Favourites'},{path:'/Music/Playlists/Evening.m3u8',name:'Evening'}],stats:{tracks:9,needsReview:1,albums:5,playlists:2},libraryPath:'/Music',lastScanAt:1793102400,truncated:false};else if(url.pathname.endsWith('/changes'))data={changes:[]};return new Response(JSON.stringify(data),{status:200,headers:{'Content-Type':'application/json'}})};
</script><script type="module" src="/js/musiccurator-main.mjs"></script></body></html>
